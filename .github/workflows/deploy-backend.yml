name: Deploy backend to Render

# Manual only - triggered by the Admin -> Data page's deploy button (which
# calls the backend, which dispatches this workflow) or by hand from the
# Actions tab. Never on push: a backend redeploy is a deliberate action,
# not something that should happen as a side effect of an unrelated commit.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_URL secret is not set - add it under Settings > Secrets and variables > Actions"
            exit 1
          fi
          curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
