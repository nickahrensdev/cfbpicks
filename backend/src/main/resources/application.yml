# Shared defaults for every environment.
# Anything environment-specific belongs in application-local.yml or
# application-prod.yml, which are layered on top of this file.
spring:
  application:
    name: nickspicks-api
  profiles:
    # Overridden at runtime with SPRING_PROFILES_ACTIVE or -Dspring.profiles.active
    default: local
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: nickspicks-pool
      connection-timeout: 30000
  jpa:
    open-in-view: false
    # The schema is owned by Flyway in every environment.
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          # The season loads write ~888 rows each. Without batching that is a
          # round trip per row through Supabase's pooler, which is what made
          # the schedule load take ~53s and starve the JVM badly enough for
          # the /lines call right after it to time out.
          batch_size: 100
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    # The Supabase "public" schema already contains objects (the scaffold's
    # demo table, plus whatever Supabase puts there), and Flyway refuses to
    # touch a non-empty schema with no history table. Baseline at 0 so V1
    # still runs on top of what is already there.
    baseline-on-migrate: true
    baseline-version: 0
# JWT verification is configured in code (SecurityConfig#jwtDecoder) rather
# than here: it needs the ES256 algorithm AND an audience check, and having
# half the setup in YAML and half in Java is how the two drift apart.
# The JWKS URL is derived from app.supabase.url.

server:
  port: ${PORT:8080}
  shutdown: graceful
  compression:
    enabled: true
    mime-types: application/json,text/html,text/css,application/javascript

management:
  endpoints:
    web:
      exposure:
        include: health,info
      # Actuator does NOT use the CORS mapping in WebConfig. Its endpoints are
      # served by their own handler mapping, which reads only these properties
      # - so a mapping registered there silently does nothing here, and the
      # preflight comes back 403 with no CORS headers at all.
      #
      # Same origins as the API, from the same environment variable, because
      # the admin page calling this is the same app that calls /api.
      cors:
        allowed-origins: ${ALLOWED_ORIGINS:}
        # GET is all that is exposed; nothing under /actuator is writable.
        allowed-methods: GET,OPTIONS
        # The client sends Authorization and Content-Type on every request,
        # and any header it sends has to be named here or the preflight fails.
        allowed-headers: "*"
        max-age: 3600
  info:
    # What the admin Data page reports. build comes from the maven plugin's
    # build-info goal; the rest describe the machine actually serving, which
    # is the question being asked when someone opens that panel - "what is
    # running right now, and is it what I deployed".
    build:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true
    env:
      enabled: true
  endpoint:
    health:
      show-details: never

# Surfaced by /actuator/info, which the admin Data page reads. The profile
# name is the fact that panel exists to answer - a build looks identical
# whether it came up on local or prod config, and it is the config that
# decides which database it is pointed at.
info:
  app:
    name: "@project.name@"
    profile: ${app.environment}

app:
  environment: unknown
  allowed-origins: []
  # Emails auto-promoted to ADMIN on sign-in. Bootstrap for the first admin;
  # after that, roles are managed from the admin page.
  admin-emails: ${ADMIN_EMAILS:}
  supabase:
    url: ${SUPABASE_URL:}
  pickem:
    season: 2026
    max-picks-per-week: 10
    lock-lead-minutes: 30
  cfbd:
    # Gates IngestScheduler's cron jobs only (schedule sync, line sync, score
    # poll) - manual admin loads and on-demand ATS/matchup fetches go through
    # CfbdClient directly and are unaffected by this flag either way.
    enabled: false
    base-url: https://api.collegefootballdata.com
    api-key: ${CFB_DATA_API_KEY:}
    # Generous on purpose: the season-wide /lines load runs right after ~888
    # single-row game writes, and on Render's throttled free tier a starved
    # JVM can stall a socket read long past a tight limit even though the
    # response itself is small and fast. 10s here failed that load outright.
    timeout-seconds: ${CFBD_TIMEOUT_SECONDS:90}
    # Which games members pick.
    classification: fbs
    # Which programs are stored for team/roster/coach pages. /teams returns
    # all 684 across every division in one call, so adding fcs is free and
    # makes non-FBS opponents clickable. Append ii and iii to go further.
    team-classifications:
      - fbs
      - fcs
  cron:
    secret: ${CRON_SECRET:}
    # POST /api/cron/lines is built and reachable, but does nothing until this
    # is true - see CronController. Off deliberately: each call spends CFBD
    # quota, so the schedule and the permission to spend are separate switches.
    # Flip with APP_CRON_LINES_ENABLED=true once the pg_cron schedule exists.
    lines-enabled: ${APP_CRON_LINES_ENABLED:false}
